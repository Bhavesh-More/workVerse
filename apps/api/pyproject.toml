[project]
name = "workverse-api"
version = "0.1.0"
description = "WorkVerse AI FastAPI backend: authoritative workplace simulation, AI dialogue and evidence-grounded evaluation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "httpx>=0.27",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "pyjwt[crypto]>=2.8",
  "python-multipart>=0.0.9",
  "reportlab>=5.1.0",
  "matplotlib>=3.11.2",
  "pypdf>=5.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: tests that require live Supabase/Ollama credentials (skipped when not configured)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "E501", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
