# Local-development object storage only.
# Before running, review MinIO's current maintenance/distribution/license status and set
# MINIO_IMAGE to a reviewed, pinned image that you have built or are authorized to use.
# This file intentionally refuses to choose a floating image implicitly.
services:
  minio:
    image: ${MINIO_IMAGE:?Set MINIO_IMAGE to a reviewed, pinned MinIO image in your local .env}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in your local .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in your local .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - workverse_minio_data:/data
    restart: unless-stopped
    # Keep local storage bound to loopback. Do not use these admin credentials in production.

volumes:
  workverse_minio_data:
